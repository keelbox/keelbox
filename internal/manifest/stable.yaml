# keelbox release manifest: the tested versions `keelbox apply` installs.
# Bump release whenever a pin changes, and record why in the commit.
#
# Pinning policy (docs/adr/0004-release-manifest.md):
#   exact     mise, node, pnpm, tmux plugins: apply converges to these.
#   series    docker: apply installs the newest package in this major series.
#   exact     caddy, restic: release binaries checked against these checksums.
manifest: 1
channel: stable
release: "2026.11.4"

os:
  ubuntu: ["24.04", "26.04"]
  arch: [amd64, arm64]

docker:
  series: "29"
  # Primary key fingerprint of https://download.docker.com/linux/ubuntu/gpg
