# Full acceptance test (make e2e) in an LXD VM on a hosted runner, which has
# KVM. The box installs Claude Code and Codex with the vendors' installers,
# so each run tests their current releases. On demand only; see
# docs/maintaining.md.
name: e2e

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  lxd:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: LXD with KVM
        run: |
          test -c /dev/kvm
          sudo snap install lxd
          sudo lxd init --auto
          sudo chmod 0666 /var/snap/lxd/common/lxd/unix.socket
          # The first lxc call prints a welcome to stderr; get it out of the way.
          lxc list >/dev/null 2>&1
          # Docker on the runner sets FORWARD to DROP, which cuts the VM off.
          sudo iptables -P FORWARD ACCEPT
      - run: make e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: e2e-logs/
          retention-days: 14
