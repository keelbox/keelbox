# Area labels for pull requests, by changed path (.github/workflows/pull-request.yml).
"area: cli":
  - changed-files:
      - any-glob-to-any-file: [cmd/**, internal/cli/**, internal/config/**]
"area: modules":
  - changed-files:
      - any-glob-to-any-file: [internal/engine/**, internal/modules/**, internal/system/**, internal/manifest/**]
"area: providers":
  - changed-files:
      - any-glob-to-any-file: [internal/provider/**]
"area: release":
  - changed-files:
      - any-glob-to-any-file: [get/**, internal/release/**, internal/selfupdate/**, .goreleaser.yaml, release-please-config.json, scripts/publish.sh, scripts/channel-index.sh]
docs:
  - changed-files:
      - any-glob-to-any-file: ["**/*.md", docs/**]
ci:
  - changed-files:
      - any-glob-to-any-file: [.github/**, scripts/check.sh, scripts/e2e.sh, test/e2e/**]
