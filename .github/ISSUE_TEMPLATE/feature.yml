name: Feature request
description: Something keelbox should do.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What keelbox could do. Config shape or command line welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you do now, or other ways to solve it.
